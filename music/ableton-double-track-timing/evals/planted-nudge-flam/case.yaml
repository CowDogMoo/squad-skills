schema_version: "1.1"
name: planted-nudge-flam
# Needs the source Coven set and its DI recordings on this machine; place-files.sh
# copies the set and plants a +0.0625-beat nudge on two Jayson Scratch clips.
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The answer pins the bar 90-91 flam on two Jayson Scratch clips that sit
  +0.0625 beat (about 31 ms at 120 BPM) late: the clip starting at beat
  357.0625 and the one starting at 362.0625. Evidence: their other copies of
  the same takes (341.0, 346.0) sit on whole-beat anchors, and the same take
  pairings with Jason Scratch line up differently in bar 87. It recommends
  moving both clips back by 0.0625 beat, to 357.0 and 362.0, does not blame
  or move Jason Scratch's deliberately offset slice at 362.3125, and changes
  nothing in Live or in the set file.
