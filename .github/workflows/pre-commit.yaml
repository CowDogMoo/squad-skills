---
name: Pre-Commit
on:
  merge_group:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  schedule:
    # Run once a week (see https://crontab.guru)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.7"
  GO_VERSION: "1.26.4"
  SHFMT_VERSION: "v3.10.0"
  PRETTIER_VERSION: "3.3.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pre-commit's `language: golang` initialization runs
          # `git fetch origin --tags` on the cloned squad repo. With the
          # default credential helper still configured for this repo's
          # token, that fetch prompts for a username (the helper is
          # scoped to squad-skills, not cowdogmoo/squad). Anonymous
          # access works for the public squad repo, so drop the helper.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit and pyyaml
        run: python3 -m pip install pre-commit pyyaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install shell formatting tools
        run: |
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install squad (for skill validation hook)
        # `go install github.com/cowdogmoo/squad/cmd/squad@...` fails on
        # the hosted runner: proxy.golang.org returns 404 for arbitrary
        # squad commits and the direct fetch fallback hits the runner's
        # auth-prompting credential helper. Cloning the public source over
        # plain HTTPS and building locally sidesteps both — the GHA git
        # client allows anonymous reads against public repos.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 https://github.com/CowDogMoo/squad.git "$tmp"
          cd "$tmp" && go build -o "$tmp/bin/squad" ./cmd/squad
          install -m 0755 "$tmp/bin/squad" "$(go env GOPATH)/bin/squad"

      - name: Install prettier
        run: npm install -g "prettier@${PRETTIER_VERSION}"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
