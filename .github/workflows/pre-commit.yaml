---
name: Pre-Commit
on:
  merge_group:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  schedule:
    # Run once a week (see https://crontab.guru)
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13.7"
  GO_VERSION: "1.25.4"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # pre-commit's `language: golang` initialization runs
          # `git fetch origin --tags` on the cloned squad repo. With the
          # default credential helper still configured for this repo's
          # token, that fetch prompts for a username (the helper is
          # scoped to squad-skills, not cowdogmoo/squad). Anonymous
          # access works for the public squad repo, so drop the helper.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit and pyyaml
        run: python3 -m pip install pre-commit pyyaml

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install shell formatting tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install prettier
        run: npm install -g prettier

      - name: Run pre-commit
        env:
          # actions/checkout v6 injects credentials via a temp config file
          # referenced through GIT_CONFIG_* env vars. pre-commit's golang
          # language plugin clones the squad repo and runs
          # `git fetch origin --tags`; that fetch picks up the temp token
          # (scoped to squad-skills) and gets rejected, so git prompts for
          # a username — which has no TTY in CI. The squad repo is public,
          # so anonymous fetch works. Force git to ignore inherited config
          # and silence any interactive prompts.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: pre-commit run --all-files --show-diff-on-failure --color=always
