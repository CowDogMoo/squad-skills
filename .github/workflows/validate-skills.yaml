---
name: Validate Skills
on:
  merge_group:
  # No `paths` filter on pull_request: the Validation Summary job is a
  # required status check on main, and a filtered-out workflow never
  # reports, which would leave non-skill PRs unmergeable. The jobs scan
  # the whole repo rather than the diff, so running on every PR is
  # correct and costs ~30s.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - '**/SKILL.md'
      - '**/scripts/**'
      - '**/evals/evals.json'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'music/.claude-plugin/**'
      - '.github/workflows/validate-skills.yaml'
      - '.github/workflows/reusable-validate-skills.yaml'
      - '.github/workflows/skill-evals.yaml'
      - '.github/scripts/**'
      - '**/evals/files/**'
      - '.github/skill-evals.json'
      - '.github/skill-evals-managed-settings.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Skills live two levels deep (category/skill). The category folders
  # are declared in .claude-plugin/plugin.json's "skills" list, plus the
  # source folder of every other plugin in marketplace.json (music/) —
  # the plugin loader scans each listed path exactly one level deep, so
  # a folder missing from both is invisible to every plugin. This job
  # reads those lists, verifies the repo root contains exactly those
  # folders, and feeds them to the validation matrix below so CI can
  # never drift from what the plugins actually load.
  categories:
    name: Category Layout
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.list }}
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read categories from plugin.json and check repo layout
        id: discover
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          with open(".claude-plugin/plugin.json", encoding="utf-8") as fh:
              plugin = json.load(fh)
          with open(".claude-plugin/marketplace.json", encoding="utf-8") as fh:
              market = json.load(fh)
          cats = {c.removeprefix("./") for c in plugin["skills"]}
          cats |= {
              str(p["source"]).removeprefix("./")
              for p in market["plugins"]
              if str(p["source"]) not in (".", "./")
          }
          cats = sorted(cats)

          failed = False
          for cat in cats:
              if not Path(cat).is_dir():
                  print(f"::error::plugin.json lists a missing skills directory: {cat}")
                  failed = True
              elif (Path(cat) / "SKILL.md").exists():
                  print(f"::error file={cat}/SKILL.md::category folder must hold skill directories, not be a skill itself")
                  failed = True

          root_dirs = sorted(
              p.name for p in Path(".").iterdir()
              if p.is_dir() and not p.name.startswith((".", "_"))
          )
          for d in root_dirs:
              if d not in cats:
                  print(f"::error file={d}::top-level directory is not registered as a category in .claude-plugin/plugin.json 'skills' or as a marketplace plugin source")
                  failed = True

          if failed:
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"list={json.dumps(cats)}\n")
          print(f"✓ categories: {', '.join(cats)}")
          EOF

  # The validation logic lives in reusable-validate-skills.yaml so other
  # repos (e.g. squad-agents) can call the same checks without a drifting
  # copy. It validates one directory whose immediate children are skills,
  # so fan out over the category folders discovered above.
  skills:
    name: Skills
    needs: [categories]
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.categories.outputs.list) }}
    uses: ./.github/workflows/reusable-validate-skills.yaml
    with:
      skills-dir: ${{ matrix.category }}

  # Checks the skill-evals allowlist and every evals.json it points at, and
  # that skill-evals.yaml still runs only on dispatch or schedule from main.
  # No secrets: the evals themselves run in skill-evals.yaml.
  eval-config:
    name: Eval Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.0"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate the eval allowlist and workflow
        run: python .github/scripts/skill_evals.py validate

      - name: Test eval input staging
        run: python .github/scripts/test_skill_evals_staging.py

      - name: Test the eval judge
        run: python .github/scripts/test_skill_evals.py

  # Repo policy: no `allowed-tools` on shared skills, matching plugin
  # versions, and a version bump on pull requests that change skill or
  # manifest files.
  policy:
    name: Skill Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check skill policy
        run: python3 .github/scripts/check_skills.py policy

      - name: Test the policy checks
        run: python3 .github/scripts/test_check_skills.py

      - name: Require a plugin version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_skills.py version-bump --base "$BASE_SHA"

  # The authoritative manifest check. --strict turns warnings (unknown
  # fields, missing version) into failures. The CLI version is pinned so a
  # new release cannot add a warning that fails unrelated pull requests.
  plugin-validate:
    name: Plugin Validate
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: "2.1.329"
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace and both plugins
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate --strict music

  # The bundled script suites. None needs secrets or a network beyond the
  # package install. Pre-commit runs the same suites locally through
  # .hooks/run-script-tests.sh when their files change.
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    env:
      ALPHATAB_VERSION: "1.9.0"
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"

      - name: Install uv
        run: pip install uv

      - name: Install alphaTab for the native .gp blocks of test_gp_tab.py
        run: npm install --prefix music/guitar-pro/scripts "@coderline/alphatab@${ALPHATAB_VERSION}"

      - name: Run the script suites
        run: .hooks/run-script-tests.sh

  # Kept as a plain job in this workflow (not inside the reusable one) so
  # its check-run name stays exactly "Validation Summary" — the required
  # status check on main. Nested reusable-workflow jobs report as
  # "Skills / <job name>", which would break that match.
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [categories, skills, eval-config, policy, plugin-validate, script-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.categories.result }}" != "success" ] || \
             [ "${{ needs.skills.result }}" != "success" ] || \
             [ "${{ needs.eval-config.result }}" != "success" ] || \
             [ "${{ needs.policy.result }}" != "success" ] || \
             [ "${{ needs.plugin-validate.result }}" != "success" ] || \
             [ "${{ needs.script-tests.result }}" != "success" ]; then
            echo "::error::Skill validation failed (categories: ${{ needs.categories.result }}, skills: ${{ needs.skills.result }}, eval config: ${{ needs.eval-config.result }}, policy: ${{ needs.policy.result }}, plugin validate: ${{ needs.plugin-validate.result }}, script tests: ${{ needs.script-tests.result }})"
            exit 1
          fi
          echo "✓ All skill validations passed"
