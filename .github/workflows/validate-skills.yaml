---
name: Validate Skills
on:
  merge_group:
  # No `paths` filter on pull_request: the Validation Summary job is a
  # required status check on main, and a filtered-out workflow never
  # reports, which would leave non-skill PRs unmergeable. The jobs scan
  # the whole repo rather than the diff, so running on every PR is
  # correct and costs ~30s.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - '**/SKILL.md'
      - '**/evals/evals.json'
      - '.github/workflows/validate-skills.yaml'
      - '.github/workflows/reusable-validate-skills.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The validation logic lives in reusable-validate-skills.yaml so other
  # repos (e.g. squad-agents) can call the same checks without a drifting
  # copy. Skills here live at the repo root, hence skills-dir: ".".
  skills:
    name: Skills
    uses: ./.github/workflows/reusable-validate-skills.yaml
    with:
      skills-dir: "."

  # Kept as a plain job in this workflow (not inside the reusable one) so
  # its check-run name stays exactly "Validation Summary" — the required
  # status check on main. Nested reusable-workflow jobs report as
  # "Skills / <job name>", which would break that match.
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [skills]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.skills.result }}" != "success" ]; then
            echo "::error::Skill validation failed (result: ${{ needs.skills.result }})"
            exit 1
          fi
          echo "✓ All skill validations passed"
