---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        entry: yamllint --strict -c .hooks/linters/yamllint.yaml

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        entry: codespell -q 3 -f -S ".git,.github,README.md" --ignore-words-list=hass

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: script-must-have-extension
        name: Ensure shell scripts end with .sh
        types: [shell]
      - id: shellcheck
      - id: shfmt

  # GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Check GitHub Actions

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--config", ".hooks/linters/markdownlint.json"]

  - repo: local
    hooks:
      - id: prettier
        name: Run prettier
        entry: .hooks/prettier.sh
        language: script
        types: [json, yaml]

  # Calls into squad's validator directly. The squad repo also ships
  # the equivalent declaration in .pre-commit-hooks.yaml under
  # `id: squad-skill-validate` with `language: golang` so future repos
  # without a Go toolchain can consume it that way — for this repo we
  # already install squad in CI, so the local form avoids pre-commit's
  # internal `git fetch --tags` step which trips actions/checkout's
  # injected credentials in the GHA runner.
  - repo: local
    hooks:
      - id: squad-skill-validate
        name: Validate Anthropic Agent Skill manifests
        entry: squad skill validate
        language: system
        files: '(^|/)SKILL\.md$'
        pass_filenames: true
